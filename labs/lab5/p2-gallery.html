<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 5 - Gallery</title>
    <link rel="stylesheet" href="styles/p2-gallery.css" />
  </head>
<body>
    
    <h1>Photo Gallery</h1>

    <img class="hero" src="images/book-tulips.jpg" alt="Open books with white tulips and a cup of coffee">

    <div class="gallery">
    <figure class="tile">
        <img src="images/water-reflection.jpg" alt="Black and white reflection of tree branches on water">
        <figcaption>Reflection on Water</figcaption>
    </figure>

    <figure class="tile tile-portrait">
        <img src="images/eiffel-tower.jpg" alt="The Eiffel Tower viewed from a street between buildings in Paris">
        <figcaption>Eiffel Tower, Paris</figcaption>
    </figure>

    <figure class="tile">
        <img src="images/rings.jpg" alt="Silver rings displayed on a market stall with a hand picking one out">
        <figcaption>Jewelry Market Stall</figcaption>
    </figure>

    <figure class="tile">
        <img src="images/palm-shadow.jpg" alt="Palm leaf shadow cast on an old European-style building facade">
        <figcaption>Palm Shadow on the Wall</figcaption>
    </figure>

    <figure class="tile">
        <img src="images/hot-chocolate.jpg" alt="Hot chocolate with whipped cream on a cafe table in Paris">
        <figcaption>Hot Chocolate at Carette Paris</figcaption>
    </figure>

    <figure class="tile">
        <img src="images/night-bus-stop.jpg" alt="People waiting at a bus stop at night, viewed from above">
        <figcaption>Bus Stop at Night</figcaption>
    </figure>

    </div>
</body>
</html>
